name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "xposed/**"
      - "lyric/**"
      - "common/**"
      - "common-legacy/**"
      - "bridge/**"
      - "opencc-lite/**"
      - "lyricon/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 SDK 平台与构建工具
        run: |
          set -e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # API 37 在公开频道里可能叫 android-37.0（Android 17 预览），逐个尝试
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" \
            || "$SDKM" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" \
            || "$SDKM" "platforms;android-37" "build-tools;37.0.0" \
            || echo "API 37 未能安装，编译阶段会暴露真实错误"
          "$SDKM" --list_installed | sed -n '1,40p' || true

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 Debug 包
        run: |
          chmod +x ./gradlew
          ./gradlew :lyricon:assembleStandardDebug --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          ls -l build/all-apks/debug/ || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 词岛-debug-apk
          path: |
            build/all-apks/debug/*.apk
            lyricon/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
