name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "xposed/**"
      - "lyric/**"
      - "common/**"
      - "common-legacy/**"
      - "bridge/**"
      - "opencc-lite/**"
      - "lyricon/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK 工具
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # API 37 在公开频道里可能以 37.0 命名；两个名字都试一遍
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" \
            || sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" \
            || (sdkmanager "platforms;android-37" "build-tools;37.0.0")
          sdkmanager --list_installed | sed -n '1,40p'

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 编译 Debug 包
        run: |
          chmod +x ./gradlew
          ./gradlew :lyricon:assembleStandardDebug --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          ls -l build/all-apks/debug/ || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 词岛-debug-apk
          path: |
            build/all-apks/debug/*.apk
            lyricon/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
