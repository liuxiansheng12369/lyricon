# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 工程根目录含中文（lyricon-v3-全新架构），AGP 路径检查在 Windows 会拒绝非 ASCII 路径
# 此为 AGP 官方提供的开关（b.android.com/95744），关闭该检查
android.overridePathCheck=true
#android.disallowKotlinSourceSets=false

# 禁用 Gradle Kotlin DSL 源码包自动下载（国内访问 github.com 失败会导致 sync 报错）
systemProp.org.gradle.kotlin.dsl.source.distribution.enabled=false
kotlin.dsl.source.distribution.enabled=false
